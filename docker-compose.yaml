version: "3.9"

services:
  db:
    image: postgres:16
    container_name: eventforge_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: